<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Assignment - Links and Scrolling</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
    "
  >
    <h1>My HTML Assignment</h1>

    <!-- Three Different Links -->
    <h2>Useful Links</h2>
    <p>
      <a href="https://www.google.com" target="_blank">Google</a> |
      <a href="https://unsplash.com" target="_blank">Unsplash</a> |
      <a href="https://www.w3schools.com" target="_blank">W3Schools</a>
    </p>

    <hr />

    <!-- Scrolling Text -->
    <h2>Scrolling Text</h2>
    <marquee
      behavior="scroll"
      direction="left"
      scrollamount="6"
      style="color: darkblue; font-size: 24px"
    >
      Welcome to my website! This is my HTML assignment with scrolling text and
      image.
    </marquee>

    <hr />

    <!-- Scrolling Image (Unsplash) -->
    <h2>Scrolling Image</h2>
    <marquee behavior="scroll" direction="right" scrollamount="8">
      <img
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400"
        alt="Mountain lake from Unsplash"
        width="300"
        height="200"
      />
       
    </marquee>

    <hr />

    <!-- Scrolling Image and Text Together (Vertical) -->
    
  </body>
</html>
