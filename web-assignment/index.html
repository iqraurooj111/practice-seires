<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links and Scrolling Demo</title>
</head>
<body>

  <h1>My HTML Assignment</h1>

  <h2>Three Different Links</h2>
   <a href="https://www.google.com" target="_blank">Google</a> 
   <br>
    <a href="https://www.github.com" target="_blank">GitHub</a> 
    <br>
    <a href="https://www.youtube.com" target="_blank">YouTube</a> 
  <hr>

  <h2>Scrolling Text</h2>
  <marquee behavior="scroll" direction="left" scrollamount="6">
    Welcome to my website! This text is scrolling from right to left.
  </marquee>

  <hr>

  <h2>Scrolling Image</h2>
  <marquee behavior="scroll" direction="right" scrollamount="6">
    <img src="Screenshot%202026-09-11%20000119.png" alt="Scrolling Image" width="200">
  </marquee>

  <hr>

  <h2>Scrolling Image and Text Together</h2>
  <marquee behavior="alternate" direction="left" scrollamount="5">
    <img src="Screenshot%202026-09-11%20000129.png" alt="Scrolling Image" width="200">
    <b>Image and text are scrolling together!</b>
  </marquee>

</body>
</html>
